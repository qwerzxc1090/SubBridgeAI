name: 개선 제안
description: 사용 흐름이나 기능에 대한 의견을 남겨 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: "공개 글에 API 키, 자막 원문, 개인 정보는 포함하지 마세요."
  - type: textarea
    id: problem
    attributes:
      label: 불편한 점
      description: 어떤 작업에서 불편했는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 개선
    validations:
      required: true
