name: 버그 신고
description: 공개 베타의 재현 가능한 오류를 알려 주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        API 키, 자막 원문, settings.json, 개인 경로가 포함된 로그는 올리지 마세요.
        보안 취약점은 공개 Issue 대신 Private Vulnerability Reporting을 이용해 주세요.
  - type: input
    id: version
    attributes:
      label: 앱 버전
      placeholder: 0.1.0-beta.5
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 버전
      options:
        - Windows 11 x64
        - Windows 10 x64
        - 기타
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 민감정보를 제거한 예시로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
